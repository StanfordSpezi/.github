name: Periphery

on:
  workflow_call:
    inputs:
      path:
        description: 'The path where the project is located. Defaults to $GITHUB_WORKSPACE'
        required: false
        type: string
        default: '.'
      runsonlabels:
        description: 'JSON-based collection of labels indicating which type of github runner should be chosen'
        required: false
        type: string
        default: '["macos-14"]'
      xcodeversion:
        description: 'The Xcode version used for the build'
        required: false
        type: string
        default: 'latest-stable'

permissions:
  contents: read

jobs:
  periphery:
    name: Periphery
    runs-on: ${{ fromJson(inputs.runsonlabels) }}
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcodeversion }}
    - name: Check environment
      run: |
          xcodebuild -version
          swift --version
          echo "env.selfhosted: ${{ env.selfhosted }}"
          echo "environment: ${{ inputs.environment }}"
    - name: Install periphery
      if: ${{ !env.selfhosted }}
      # Periphery is distributed through Homebrew core since 3.0; the peripheryapp/periphery tap is no longer updated
      # and no longer loads with current Homebrew. Remove it from runners that still have it, and replace the binary it linked.
      run: |
        brew untap --force peripheryapp/periphery 2>/dev/null || true
        brew install periphery || brew link --overwrite periphery
        periphery version
    - name: Run periphery
      run: |
        periphery scan --relative-results --format github-actions --strict -- -skipPackagePluginValidation -skipMacroValidation
    - name: Cleanup periphery
      if: always()
      run: rm -rf ~/Library/Caches/com.github.peripheryapp
